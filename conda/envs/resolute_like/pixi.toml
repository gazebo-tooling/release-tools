[workspace]
name = "gazebo"
version = "0.1.0"
description = "Pixi configuration to build Gazebo main branches (M and Rotary). Similar versions than Ubuntu Resolute."
authors = ["Jose Luis Rivero <jrivero@honurobotics.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "win-64"]

[target.win-64.activation.env]
QT_QPA_PLATFORM_PLUGIN_PATH="%CONDA_PREFIX%\\Library\\lib\\qt6\\plugins\\platforms"
QML2_IMPORT_PATH="%CONDA_PREFIX%\\Library\\lib\\qt6\\qml"

[target.win-64.dependencies]
dlfcn-win32 = "*"
vs2019_win-64 = ">=19.29.30139,<20"

[target.linux.dependencies]
libegl-devel = "==1.7.0"
libgl-devel = "==1.7.0"
libglu = "==9.0.3"
libglvnd-devel = "==1.7.0"

[target.linux-64.dependencies]
vulkan-headers = "*"

[build-dependencies]
# The following are "tooling" dependencies, used to install or initiate builds.
# They are pinned less aggressively, same approach than ROS 2 pixi.toml.
cmake = "==4.2.3"
colcon-common-extensions = "*"
# Python 3.14 needs a colcon-core that understands the new argparse internals,
# same bound used by ROS 2 pixi.toml
colcon-core = ">=0.21.1,<0.22"
pkg-config = "*"
vcstool = "==1.1.7"

[dependencies]
# The rest of the dependencies are used by one or more Gazebo packages. They are
# pinned to versions as close as possible to their counterparts in Ubuntu
# Resolute. When the package is also present in the ROS 2 pixi.toml
# (https://github.com/ros2/ros2/blob/rolling/pixi.toml) the same version is used.
assimp = "==6.0.4"
bullet-cpp = "==3.25"  # Ubuntu has 3.24, but ROS 2 uses 3.25
cli11 = "==2.6.2"  # Ubuntu has 2.6.1, which conda-forge does not have
cppzmq = "==4.10.0"
curl = "==8.18.0"
dartsim-cpp = "==6.16.7"
eigen = "==3.4.0"
ffmpeg = "==8.0.1"
freeimage = "==3.18.0"
gdal = "==3.12.2"
gflags = "==2.2.2"
jsoncpp = "==1.9.6"
libcurl = "==8.18.0"
libgdal-netcdf = "==3.12.2"
libprotobuf = "==6.31.1"  # Ubuntu has 3.21.12, but conda-forge has no Python 3.14 protobuf before 6.31.1
libsqlite = ">=3.46,<4"
libwebsockets = "==4.3.5"
libzenohc = "==1.8.0"  # Ubuntu does not have zenoh, version from packages.osrfoundation.org
libzenohcxx = "==1.8.0"
libzip = "==1.11.2"  # Ubuntu has 1.11.4, which conda-forge does not have
libmujoco = "==3.5.0"
ogre = "==1.10.12.1"  # Ubuntu has 1.12.10, which conda-forge does not have
ogre-next = "==2.3.3"
openssl = ">=3.4,<4"
protobuf = "==6.31.1"  #  Ubuntu has 3.21.12, see libprotobuf
pybind11 = "==3.0.1"
python = "==3.14.3"
qt6-main = "==6.11.0"  # Ubuntu has 6.10.2, but ROS 2 uses 6.11 (pyqt6 builds only against 6.11 for Python 3.14)
ruby = "==3.3.6"  # Ubuntu has 3.3.8, which conda-forge does not have
# Ubuntu has 1.15.3 and ROS 2 uses 1.15.0, but dartsim-cpp 6.16 requires
# fmt 12.1 which is only supported by spdlog 1.17.0 in conda-forge
spdlog = "==1.17.0"
tinyxml2 = "==11.0.0"
yaml = "==0.2.5"
zeromq = "==4.3.5"
