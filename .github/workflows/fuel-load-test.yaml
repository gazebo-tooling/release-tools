name: Fuel load test unit tests

on:
  pull_request:
    paths:
      - 'jenkins-scripts/fuel_load_test/**'
      - '.github/workflows/fuel-load-test.yaml'
  push:
    paths:
      - 'jenkins-scripts/fuel_load_test/**'
      - '.github/workflows/fuel-load-test.yaml'

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    name: Unit tests for fuel_load_test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unit tests for fuel_load_test
        run: |
          python3 -m unittest discover -s jenkins-scripts/fuel_load_test/tests -v
