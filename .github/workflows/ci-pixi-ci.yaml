name: pixi_ci driver tests

on:
  pull_request:
    paths:
      - 'jenkins-scripts/tools/**'
      - 'jenkins-scripts/dsl/tools/**'
      - 'jenkins-scripts/dsl/gz-collections.yaml'
      - 'jenkins-scripts/lib/**'
      - 'jenkins-scripts/*-default-devel-windows-amd64.bat'
      - '.github/workflows/ci-pixi-ci.yaml'

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.10 Jammy, 3.12 Noble, 3.14 Resolute
        # python >= 3.10 in conda/config-detector, its lock pins 3.14
        python-version: ['3.10', '3.12', '3.14']
        include:
          # the CI agents run the driver on Windows with the 3.14 of that lock
          - os: windows-latest
            python-version: '3.14'
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Create the test environment
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv pytest pyyaml
      - name: Run the tests
        run: |
          python=.venv/bin/python
          if [ "$RUNNER_OS" = Windows ]; then python=.venv/Scripts/python.exe; fi
          # the driver imports and runs the dsl tools
          "$python" -m pytest -v jenkins-scripts/tools/pixi_ci/tests \
                                 jenkins-scripts/dsl/tools/tests
